<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Badges no Modo Escuro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --card-border: #dee2e6;
            --muted-text: #495057;
        }

        body.dark {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --card-border: #2a2a2a;
            --muted-text: #c7c7c7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        /* Estilos dos badges no modo escuro */
        body.dark .badge.bg-warning.text-dark {
            background-color: #ffc107 !important;
            color: #212529 !important;
        }
        body.dark .badge.bg-info.text-dark {
            background-color: #17a2b8 !important;
            color: #212529 !important;
        }
        body.dark .badge-warning,
        body.dark .badge-info,
        body.dark .badge-success,
        body.dark .badge-danger,
        body.dark .badge-secondary,
        body.dark .badge.bg-warning,
        body.dark .badge.bg-info,
        body.dark .badge.bg-success,
        body.dark .badge.bg-danger,
        body.dark .badge.bg-secondary {
            color: #000000 !important;
        }
        body.dark .badge {
            color: #000000 !important;
        }
    </style>
</head>
<body>
    <h1>Teste de Badges no Modo Escuro</h1>

    <button id="toggleTheme" class="btn btn-primary mb-4">Alternar Tema</button>

    <div class="card">
        <h3>Badges de Status das Tarefas</h3>
        <div class="mb-3">
            <span class="badge bg-warning text-dark me-2">Pendente</span>
            <span class="badge bg-info me-2">Em Progresso</span>
            <span class="badge bg-success me-2">Concluída</span>
            <span class="badge bg-danger me-2">Atrasado</span>
            <span class="badge bg-secondary me-2">Outro</span>
        </div>

        <div class="mb-3">
            <span class="badge badge-warning me-2">Pendente (badge-warning)</span>
            <span class="badge badge-info me-2">Em Progresso (badge-info)</span>
            <span class="badge badge-success me-2">Concluída (badge-success)</span>
            <span class="badge badge-danger me-2">Atrasado (badge-danger)</span>
            <span class="badge badge-secondary me-2">Outro (badge-secondary)</span>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleTheme');
        const body = document.body;

        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark');
            toggleBtn.textContent = body.classList.contains('dark') ? 'Modo Claro' : 'Modo Escuro';
        });
    </script>
</body>
</html>
