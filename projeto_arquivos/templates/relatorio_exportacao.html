<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportação de Relatórios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>Exportação de Relatórios</h2>
                <div class="card mt-3">
                    <div class="card-header">
                        <h5>Selecionar Projetos para Exportação</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="projeto-select">Projetos:</label>
                            <select multiple class="form-control" id="projeto-select" style="height: 200px;">
                                <option value="todos">🔄 Todos os projetos</option>
                                {% for projeto in projetos %}
                                <option value="{{ projeto.id }}">{{ projeto.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group mt-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="incluir_tarefas" checked>
                                <label class="form-check-label" for="incluir_tarefas">
                                    Incluir Tarefas
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="incluir_pastas" checked>
                                <label class="form-check-label" for="incluir_pastas">
                                    Incluir Pastas
                                </label>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <button id="btn-exportar-excel" class="btn btn-success mr-2">
                                <i class="fas fa-file-excel"></i> Exportar Excel
                            </button>
                            <button id="btn-exportar-csv" class="btn btn-info">
                                <i class="fas fa-file-csv"></i> Exportar CSV
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnExportarExcel = document.getElementById('btn-exportar-excel');
            const btnExportarCSV = document.getElementById('btn-exportar-csv');
            
            function getProjetosSelecionados() {
                const select = document.getElementById('projeto-select');
                const valores = Array.from(select.selectedOptions).map(option => option.value);
                
                if (valores.includes('todos') || valores.length === 0) {
                    return ['todos'];
                }
                
                return valores.map(v => parseInt(v)).filter(v => !isNaN(v));
            }
            
            function showLoading(btn, originalText) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
                btn.disabled = true;
                btn.dataset.originalText = originalText;
            }
            
            function hideLoading(btn) {
                btn.innerHTML = btn.dataset.originalText;
                btn.disabled = false;
            }
            
            function showToast(message, type = 'info') {
                // Implementação simples de toast
                alert(message);
            }
            
            btnExportarExcel.addEventListener('click', function() {
                const projetosSelecionados = getProjetosSelecionados();
                const incluirTarefas = document.getElementById('incluir_tarefas').checked;
                const incluirPastas = document.getElementById('incluir_pastas').checked;
                
                console.log('🔍 Exportando Excel com:', {
                    projetos: projetosSelecionados,
                    incluir_tarefas: incluirTarefas,
                    incluir_pastas: incluirPastas
                });
                
                if (projetosSelecionados.length === 0) {
                    showToast('Selecione pelo menos um projeto para exportar', 'warning');
                    return;
                }
                
                showLoading(this, this.innerHTML);
                
                fetch('/relatorio/exportar_excel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        projetos: projetosSelecionados,
                        incluir_tarefas: incluirTarefas,
                        incluir_pastas: incluirPastas
                    })
                })
                .then(response => {
                    hideLoading(this);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const contentDisposition = response.headers.get('content-disposition');
                    let filename = 'relatorio_projetos.xlsx';
                    
                    if (contentDisposition) {
                        const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(contentDisposition);
                        if (matches != null && matches[1]) {
                            filename = matches[1].replace(/['"]/g, '');
                        }
                    }
                    
                    return response.blob().then(blob => ({ blob, filename }));
                })
                .then(({ blob, filename }) => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    showToast('Relatório Excel exportado com sucesso!', 'success');
                })
                .catch(error => {
                    hideLoading(this);
                    console.error('Erro ao exportar Excel:', error);
                    showToast('Erro ao exportar relatório Excel: ' + error.message, 'error');
                });
            });
            
            btnExportarCSV.addEventListener('click', function() {
                const projetosSelecionados = getProjetosSelecionados();
                
                console.log('🔍 Exportando CSV com projetos:', projetosSelecionados);
                
                if (projetosSelecionados.length === 0) {
                    showToast('Selecione pelo menos um projeto para exportar', 'warning');
                    return;
                }
                
                showLoading(this, this.innerHTML);
                
                fetch('/relatorio/exportar_csv', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        projetos: projetosSelecionados
                    })
                })
                .then(response => {
                    hideLoading(this);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const contentDisposition = response.headers.get('content-disposition');
                    let filename = 'projetos.csv';
                    
                    if (contentDisposition) {
                        const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(contentDisposition);
                        if (matches != null && matches[1]) {
                            filename = matches[1].replace(/['"]/g, '');
                        }
                    }
                    
                    return response.blob().then(blob => ({ blob, filename }));
                })
                .then(({ blob, filename }) => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    showToast('Arquivo CSV exportado com sucesso!', 'success');
                })
                .catch(error => {
                    hideLoading(this);
                    console.error('Erro ao exportar CSV:', error);
                    showToast('Erro ao exportar arquivo CSV: ' + error.message, 'error');
                });
            });
        });
    </script>
</body>
</html>
