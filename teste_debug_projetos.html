<!DOCTYPE html>
<html>
<head>
    <title>Teste Debug Projetos</title>
</head>
<body>
    <h2>Teste de Debug - Projetos para Excel</h2>
    
    <div>
        <label>Projetos:</label>
        <select multiple id="nome-desktop" style="height: 200px; width: 400px;">
            <!-- Será populado via JavaScript -->
        </select>
    </div>
    
    <br>
    <button id="btn-testar" onclick="testarMapeamento()">🧪 Testar Mapeamento Nome → ID</button>
    <button id="btn-exportar-excel" onclick="simularExportacao()">📊 Simular Exportação Excel</button>
    
    <div id="debug-output" style="margin-top: 20px; padding: 10px; background: #f5f5f5; white-space: pre-wrap; font-family: monospace;"></div>
    
    <script>
        let debugOutput = document.getElementById('debug-output');
        
        function log(message) {
            console.log(message);
            debugOutput.textContent += message + '\n';
        }
        
        // Simular dados de projetos
        window.projetosData = [];
        
        // Carregar projetos reais do servidor
        async function carregarProjetos() {
            try {
                log('🔄 Carregando projetos do servidor...');
                
                const response = await fetch('/api/projetos');
                if (response.ok) {
                    const projetos = await response.json();
                    window.projetosData = projetos;
                    
                    log(`✅ Carregados ${projetos.length} projetos`);
                    
                    // Popular o select
                    const select = document.getElementById('nome-desktop');
                    select.innerHTML = '';
                    
                    projetos.forEach(projeto => {
                        const option = document.createElement('option');
                        option.value = projeto.nome;
                        option.textContent = projeto.nome;
                        select.appendChild(option);
                    });
                    
                    log('✅ Select populado com projetos');
                    
                } else {
                    log(`❌ Erro ao carregar projetos: ${response.status}`);
                    
                    // Usar dados simulados
                    window.projetosData = [
                        { id: '8b4cd282-203c-4c2f-a13e-1e0d6b0745dc', nome: '2509 - WORLD SET' },
                        { id: 'b06c31f5-4998-4add-8c6b-fad5ca77e63e', nome: '2604 - WORLD ABR' },
                        { id: '6d8f6755-78f6-44ec-be5c-24161b81e5b0', nome: '2607 - WORLD JUL' }
                    ];
                    
                    const select = document.getElementById('nome-desktop');
                    select.innerHTML = '';
                    
                    window.projetosData.forEach(projeto => {
                        const option = document.createElement('option');
                        option.value = projeto.nome;
                        option.textContent = projeto.nome;
                        select.appendChild(option);
                    });
                    
                    log('⚠️ Usando dados simulados');
                }
            } catch (error) {
                log(`❌ Erro: ${error.message}`);
            }
        }
        
        function testarMapeamento() {
            debugOutput.textContent = '';
            log('🧪 INICIANDO TESTE DE MAPEAMENTO\n');
            
            const nomeSelect = document.getElementById('nome-desktop');
            log(`🔍 nomeSelect encontrado: ${!!nomeSelect}`);
            log(`🔍 window.projetosData: ${!!window.projetosData}`);
            log(`🔍 window.projetosData type: ${typeof window.projetosData}`);
            log(`🔍 window.projetosData isArray: ${Array.isArray(window.projetosData)}`);
            log(`🔍 window.projetosData length: ${window.projetosData ? window.projetosData.length : 'undefined'}`);
            
            if (window.projetosData && window.projetosData.length > 0) {
                log(`🔍 Primeira entrada: ${JSON.stringify(window.projetosData[0], null, 2)}`);
            }
            
            if (nomeSelect && nomeSelect.selectedOptions.length > 0) {
                const projetosData = window.projetosData || [];
                const nomesSelecionados = Array.from(nomeSelect.selectedOptions).map(opt => opt.value);
                log(`🔍 nomesSelecionados: ${JSON.stringify(nomesSelecionados)}`);
                
                const projeto_ids = nomesSelecionados.map(nome => {
                    const projeto = projetosData.find(p => p.nome === nome);
                    log(`🔍 Nome '${nome}' -> Projeto encontrado: ${JSON.stringify(projeto)}`);
                    log(`🔍 Nome '${nome}' -> ID: ${projeto ? projeto.id : 'NOT FOUND'}`);
                    return projeto ? projeto.id : null;
                }).filter(id => id !== null);
                
                log(`🔍 projeto_ids final: ${JSON.stringify(projeto_ids)}`);
                
                if (projeto_ids.length === nomesSelecionados.length) {
                    log('✅ MAPEAMENTO FUNCIONANDO CORRETAMENTE!');
                } else {
                    log('❌ PROBLEMA NO MAPEAMENTO!');
                }
            } else {
                log('⚠️ Nenhum projeto selecionado. Selecione projetos primeiro.');
            }
        }
        
        async function simularExportacao() {
            log('\n📊 SIMULANDO EXPORTAÇÃO EXCEL\n');
            
            const nomeSelect = document.getElementById('nome-desktop');
            if (!nomeSelect || nomeSelect.selectedOptions.length === 0) {
                log('⚠️ Selecione projetos primeiro!');
                return;
            }
            
            // Mapear nomes para IDs (mesmo código do template)
            const projetosData = window.projetosData || [];
            const nomesSelecionados = Array.from(nomeSelect.selectedOptions).map(opt => opt.value);
            const projeto_ids = nomesSelecionados.map(nome => {
                const projeto = projetosData.find(p => p.nome === nome);
                return projeto ? projeto.id : null;
            }).filter(id => id !== null);
            
            log(`📋 Enviando requisição com projeto_ids: ${JSON.stringify(projeto_ids)}`);
            
            try {
                const response = await fetch('/relatorio/gantt_excel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        gantt_base64: '',
                        projeto_ids: projeto_ids,
                        status: [],
                        colecao: [],
                        data_inicio: '',
                        data_fim: ''
                    })
                });
                
                log(`📊 Status resposta: ${response.status}`);
                
                if (response.ok) {
                    log('✅ EXPORTAÇÃO FUNCIONOU!');
                    const blob = await response.blob();
                    log(`📄 Tamanho do arquivo: ${blob.size} bytes`);
                } else {
                    const text = await response.text();
                    log(`❌ Erro na exportação: ${text}`);
                }
                
            } catch (error) {
                log(`❌ Erro na requisição: ${error.message}`);
            }
        }
        
        // Carregar dados ao inicializar
        window.addEventListener('load', carregarProjetos);
    </script>
</body>
</html>
