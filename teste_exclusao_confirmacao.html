<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Confirmação de Exclusão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Teste de Confirmação de Exclusão</h2>
        
        <!-- Simulação de um card de projeto -->
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Projeto Teste</h5>
                <p class="card-text">Este é um projeto de teste para verificar a confirmação de exclusão.</p>
                
                <!-- Botões de ação -->
                <div class="d-flex gap-2">
                    <form action="/projetos/excluir/teste-id" method="POST" style="display:inline;">
                        <button type="button" class="btn btn-danger btn-sm btn-excluir-projeto" 
                                data-projeto-id="teste-id" title="Excluir">
                            <i class="fas fa-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmação de exclusão -->
    <div class="modal fade" id="modalConfirmarExclusaoProjeto" tabindex="-1"
        aria-labelledby="modalConfirmarExclusaoProjetoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalConfirmarExclusaoProjetoLabel">
                        <i class="fas fa-trash"></i> Confirmar Exclusão
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja excluir este projeto? Esta ação não pode ser desfeita.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarExclusaoProjeto">
                        <i class="fas fa-trash"></i> Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Modal de confirmação de exclusão de projeto
        let projetoIdParaExcluir = null;
        
        document.addEventListener('DOMContentLoaded', function () {
            console.log('DOM carregado, configurando event delegation...');
            
            // Usar event delegation para elementos dinâmicos
            document.addEventListener('click', function(e) {
                console.log('Clique detectado em:', e.target);
                
                // Verificar se o clique foi em um botão de exclusão
                if (e.target.closest('.btn-excluir-projeto')) {
                    console.log('Clique em botão de exclusão detectado!');
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const btn = e.target.closest('.btn-excluir-projeto');
                    projetoIdParaExcluir = btn.getAttribute('data-projeto-id');
                    console.log('ID do projeto para exclusão:', projetoIdParaExcluir);
                    
                    // Mostrar modal de confirmação
                    const modal = new bootstrap.Modal(document.getElementById('modalConfirmarExclusaoProjeto'));
                    modal.show();
                }
            });
            
            // Configurar botão de confirmação
            document.getElementById('btnConfirmarExclusaoProjeto').addEventListener('click', function () {
                console.log('Confirmação de exclusão clicada para projeto:', projetoIdParaExcluir);
                
                if (!projetoIdParaExcluir) {
                    console.error('Nenhum projeto selecionado para exclusão');
                    return;
                }
                
                const form = document.querySelector(`.btn-excluir-projeto[data-projeto-id='${projetoIdParaExcluir}']`).closest('form');
                if (!form) {
                    console.error('Formulário não encontrado');
                    return;
                }
                
                console.log('Submetendo formulário...');
                alert('TESTE: O projeto seria excluído agora. (Formulário não será enviado no teste)');
                // form.submit(); // Desabilitado para teste
                
                // Fechar modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('modalConfirmarExclusaoProjeto'));
                if (modal) modal.hide();
                projetoIdParaExcluir = null;
            });
        });
    </script>
</body>
</html>
